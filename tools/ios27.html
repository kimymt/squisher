<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iOS 27 入力検証</title>
<style>
body { font: 16px system-ui; max-width: 640px; margin: 24px auto; padding: 16px; }
button, select, input { font: inherit; padding: 10px; margin: 6px 0; max-width: 100%; }
button { display: block; }
img { max-width: 100%; max-height: 320px; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #eee; padding: 12px; }
</style>
<h1>iOS 27 入力検証</h1>
<p>開発専用。写真は送信しません。1枚ずつ選び、写真ライブラリとFilesの両方で確認します。記録にはファイル名・画像本体を含めません。</p>
<p>直接デコードの2ボタンは現行ヘッダー検査を経由しない比較試験です。自分で撮影した通常の写真だけを使用してください。現在のアプリに代替処理を追加するものではありません。</p>
<label>入力経路 <select id="route"><option>写真ライブラリ</option><option>Files</option></select></label><br>
<label>機種・OSビルド（任意） <input id="device" placeholder="iPhone / iOSビルド"></label><br>
<input id="file" type="file" accept="image/*">
<label>品質 <select id="preset"><option value="standard">標準</option><option value="high">高品質</option><option value="max">強力圧縮</option></select></label>
<label>出力 <select id="format"><option value="jpeg">JPEG</option><option value="webp">WebP</option></select></label>
<button id="current" disabled>現行の検査・圧縮を実行</button>
<button id="bitmap" disabled>createImageBitmapを直接検証</button>
<button id="element" disabled>画像要素を直接検証</button>
<button id="share" disabled>生成結果を共有</button>
<button id="export">検証記録を保存</button>
<img id="preview" alt="生成結果の確認用画像" hidden>
<pre id="report" aria-live="polite">写真を選択してください。</pre>
<script type="module" src="./ios27.ts"></script>
</html>
